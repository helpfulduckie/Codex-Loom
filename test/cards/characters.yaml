# Include all cards from this canon file — Felicia will be skipped since she's imported below
- include: Felicia.yaml

# Explicit import with overrides — takes precedence over the include above
- import: Felicia
  variants:
    felix:
      import-variant: [Felix]

# Import Aness from canon with networked variant
- import: Aness/networked
  variants:
    subject:
      fields:
        Tagline: +{; Fused-Squad Subject}

# Local card
- id: Kaiden
  name: Kaiden Ventus
  type: Character
  template: Character
  encapsulate: true
  known: true
  triggers: Kaiden, Ventus
  fields:
    Tagline: knight; master swordsman
    Physical Traits:
      gender: male
      age: mid 20s
      hair: short brown hair
      eyes: silver eyes
      build: tall broad build
    Personality:
      keywords:
        - honorable
        - disciplined
        - protective
        - warm
    Magic:
      affinity: no affinity
      effect: magicless
