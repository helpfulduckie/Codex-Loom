# Include all cards from this canon file — Felicia will be skipped since she's imported below
- include: "{%main}/Felicia.yaml"

# Explicit import with overrides — takes precedence over the include above
- import: Felicia
  variants:
    felix:
      importVariants: [Felix]
  branches:
    felix: felix

# Import Aness from canon with networked variant; add subject-branch tagline
- import: Aness
  importVariants: [networked]
  variants:
    subject:
      body:
        Tagline: +{Fused-Squad Subject}
  branches:
    subject: subject

# Card using 'vars:' alias — tests variable-block normalization and variant override
- id: Guildmember
  name: Mira Ashfen
  pronouns: female
  aid:
    type: Character
    triggers: [Mira, Ashfen]
  notes: {known: true}
  render:
    template: Character
    wrapper: none
  vars:
    affiliation: Academy
    role: Researcher
  body:
    Tagline: Academy Scholar
  variants:
    guild:
      v:
        affiliation: Merchant Guild
        role: Agent
      body:
        Tagline: Guild Agent
  branches:
    guild: guild

# Local card
- id: Kaiden
  name: Kaiden Ventus
  pronouns: male
  aid:
    type: Character
    triggers: [Kaiden, Ventus]
  notes: {known: true}
