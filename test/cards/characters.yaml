# Include all cards from this canon file — Felicia will be skipped since she's imported below
- include: "{@main}/Felicia.yaml"

# Explicit import with overrides — takes precedence over the include above
- import: Felicia
  variants:
    felix:
      importVariants: [Felix]
  branches:
    felix: felix

# Import Aness from canon with networked variant; add subject-branch tagline
- import: Aness
  importVariants: [networked]
  variants:
    subject:
      body:
        Tagline: +{; Fused-Squad Subject}
  branches:
    subject: subject

# Local card
- id: Kaiden
  name: Kaiden Ventus
  pronouns: male
  aid:
    title: Kaiden Ventus
    type: Character
    triggers: [Kaiden, Ventus]
    encapsulate: true
    known: true
  render:
    template: Character
    wrapper: none
  body:
    Tagline: knight; master swordsman
    Physical Traits:
      gender: male
      age: mid 20s
      hair: short brown hair
      eyes: silver eyes
      build: tall broad build
    Personality:
      keywords:
        - honorable
        - disciplined
        - protective
        - warm
    Magic:
      affinity: no affinity
      effect: magicless
