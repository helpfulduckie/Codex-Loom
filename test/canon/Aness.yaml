- id: Aness
  name:
    display: Aness
    full: Aness Rozen
  pronouns: female
  aid:
    type: Character
    triggers: [Aness, Rozen]
  notes: '[e]'
  render:
    template: Character
    wrapper: none
  body:
    Tagline: Journeyman Healer; Magic Researcher
    Physical Traits:
      gender: female
      age: mid 20s
      hair: black hair, braided, waist-length
      eyes: brown eyes
      build: tall, willowy build
    Personality:
      keywords:
        - inquisitive
        - polite
        - sarcastic
        - compassionate
      expanded: |
        - {$Aness} love[s] magic research — {$Aness.she} instinctively leap[s] to explore theoretical implications
        - {$Aness.her~} polite nature is a social shield; behind it is a biting sarcasm {$Aness.she} deploy[s] when frustrated
    Magic:
      affinity: high ice-affinity; moderate growth-affinity
      effect: |
        - {$Aness.her~} growth-affinity powers strong healing magic; {$Aness.she} [is] a trained Healer first
        - {$Aness.she} know[s] basic ice combat magic but [is] a poor combat mage who flinches under pressure
  variants:
    networked:
      body:
        Physical Traits:
          other: a blue interface crystal implanted at the base of {$Aness.her~} skull
