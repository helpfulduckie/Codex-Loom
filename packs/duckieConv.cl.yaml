# duckieConv — authoring-conventions convention pack (v4 spec §8.2.2).
#
# Checks compiled body budgets, field and tagline lengths, and possible faction-field
# redundancy. Findings are WARN because the rules express authoring conventions.
#
# Enable with `lint: { packs: { duckieConv: {} } }`. Findings are coded `CL-duckieConv/NNNN`
# and are all WARN — a convention is a nudge, never a build failure.
#
# Four rules:
#
#   1. budget — raw compiled body length against a per-role cap; absent
#      `meta.duckieConv.role` uses `standard`. Placeholder expansion is not measured.
#   2. count — list and map values are counted as authored; comma-separated strings
#      are not split or counted. `appearance` allows seven items and `tagline` is word-counted.
#   3. mutexHint — WARN when more than three of overview / purpose / structure / methods
#      are present on one card. The rule is unscoped because no non-faction template
#      exposes all four fields.
#   4. role — `meta.duckieConv.role`, if set, must be one of anchor / major / standard /
#      minor.
#      A closed `map` over the `meta` sub-namespace (`over: meta`), so a typo'd key is a
#      stray-key WARN and a bad value is an out-of-set WARN, both re-coded here.

name: duckieConv
rules:
  # ── CL-duckieConv/0001 — per-role character budget ──────────────────────────
  #
  # A standard card's soft target is ~400 compiled characters; a major card's is about
  # 500, an anchor may run to 800, and a dead/offscreen NPC should be minimal. An absent
  # `meta.duckieConv.role` is measured as `standard`.
  - id: 1
    severity: warn
    budget:
      anchor: 800
      major: 500
      standard: 400
      minor: 200
    message: >-
      This card's compiled body exceeds its role's soft character budget. Keep load-bearing
      content over the target; if the excess is distinct facts, name the reason, and cut
      restated fields or mood prose.

  # ── CL-duckieConv/0002 — list-length caps on the keyword fields ─────────────
  #
  # Explicit caps apply to `vibe` (5), `personality.keywords` (4), and `tagline` (5
  # words). Other list or map fields allow six items by default; `appearance` allows
  # seven for the Character template's seven slots. Comma-separated strings are not counted.
  - id: 2
    severity: warn
    count:
      default: { max: 6 }
      fields:
        appearance: { max: 7 }
        vibe: { min: 3, max: 5 }
        personality.keywords: { min: 2, max: 4 }
        tagline: { words: { max: 5 } }
    message: >-
      A field is outside its conventional length; keep keyword lists and taglines concise.

  # ── CL-duckieConv/0003 — faction field redundancy ─────────────────────────────
  #
  # Overview, purpose, structure, and methods can overlap on a faction card. No
  # non-faction template exposes all four, so this check is unscoped.
  - id: 3
    severity: warn
    mutexHint:
      fields: [overview, purpose, structure, methods]
      max: 3
      message: >-
        A faction rarely needs more than three of overview / purpose / structure /
        methods — audit for overlap and merge down. Two fields carrying
        distinct content are usually enough at ~400–600 characters.

  # ── CL-duckieConv/0004 — the role annotation is a known value ─────────────────
  #
  # `meta.duckieConv.role` drives rule 1's budget lookup. A closed `map` over the pack's
  # own `meta` sub-namespace: an unrecognized key is CL0201 (with a typo suggestion), a
  # `role` value outside the set is CL0206 — both demoted to WARN and re-coded here. The
  # key is optional; a card with no `meta:` at all is silently measured as `standard`.
  - id: 4
    severity: warn
    over: meta
    schema:
      type: map
      keys:
        role: { type: string, values: [anchor, major, standard, minor] }
    message: >-
      `meta.duckieConv.role` must be one of anchor / major / standard / minor — it
      selects the character budget rule 1 measures this card against.
