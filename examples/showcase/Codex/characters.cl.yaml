# Project items. A file is a YAML sequence and may mix definitions, imports and includes.
# doc: 03-item-yaml.md
# Felicia's Felix variant and its branch dispatch are the worked pair in:
# doc: 05-branches-and-variants.md

# The protagonist: no story card, one Plot Essentials "you" block.
- id: Aria
  name:
    display: Aria
    full: Aria Voss
  pronouns: female
  aid:
    title: Aria Voss
    type: character
    triggers: [Aria, Voss]
  notes: The player character.
  render:
    template: Player
    storyCard: false
    plotEssential: {slot: you, order: 1, template: Player}
  body:
    Tagline: '%heroName%, Sworn Protector'
    Physical Traits:
      gender: female
      age: late 20s
      hair: short silver hair
    Personality:
      keywords: [determined, loyal, reserved]
      expanded: '{$Aria} love[s] a clean solution — {$Aria.she} act[s] before {$Aria.she} explain[s].'
  variants:
    mage:
      body:
        Tagline: '%heroName%, Academy Mage'
        Physical Traits:
          other: silver staff
  branches:
    mage: mage

# Ships both a story card (full list) and a Cast entry (brief list).
- id: Mentor
  name: Elder Roshan
  pronouns: male
  aid:
    title: Elder Roshan
    type: character
    triggers: [Roshan, Elder]
  notes: '[e]'
  meta:
    duckieConv:
      role: standard
  render:
    template: Character
    plotEssential: {slot: cast, order: 2, template: CharacterBrief}
  body:
    Tagline: Master Archivist of the Academy
    vibe: [patient, cryptic, exacting]
    Physical Traits:
      gender: male
      age: 60s
      hair: white beard, bald
    Personality:
      keywords: [wise, patient, cryptic]
    Magic:
      affinity: memory
      effect: recall of things not witnessed
    Background:
      - Catalogued the Academy's lower stacks for forty years.
      - Never sat the mastery examination.
    secret: He knows which records were burned, and by whom.

# The love interest, bound to the LI role. Its prose never names it.
- id: Kaiden
