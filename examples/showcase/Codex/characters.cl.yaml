# Bound to LI on the mage branch. Demonstrates a gender-swap variant with field operations.
- id: Felicia
  name: {display: Felicia, full: Felicia Grayls}
  pronouns: female
  aid:
    title: Felicia Grayls
    type: character
    triggers: [Felicia, Grayls]
  render:
    template: Character
  body:
    Tagline: Court Alchemist; guild liaison
    vibe: [precise, guarded, curious]
    Physical Traits:
      gender: female
      age: mid 20s
      hair: silver hair, in a controlled bun
    Personality:
      keywords: [precise, guarded]
  variants:
    Felix:
      name: {display: Felix, full: Felix Grayls}
      pronouns: male
      aid:
        title: Felix Grayls
        triggers: [Felix, Grayls]
      body:
        Physical Traits:
          gender: male
          hair: -{, in a controlled bun}      # remove substring
        Tagline: +{sworn to the Academy}      # append
  branches:
    knight: Felix

# Stays at full detail even on the lowContext tier — Pattern 2.
- id: Voss
  name: {display: Voss, full: Ilan Voss}
  pronouns: nonbinary
  aid:
    title: Ilan Voss
    type: character
    triggers: [Voss, Ilan]
  render:
    template: CharacterFull
  body:
    Tagline: The rival who never conceded
    vibe: [driven, unsentimental, patient]
    Physical Traits:
      gender: nonbinary
      age: 30s
      hair: braided black hair
    Personality:
      keywords: [driven, unsentimental]
    Magic:
      affinity: fire
      effect: controlled burns
    Background:
      - Placed second in every examination Aria placed first in.
    secret: Voss forged the letter that opened the lower stacks.
  branches:
    mage: ~                      # excluded from the mage branch entirely
