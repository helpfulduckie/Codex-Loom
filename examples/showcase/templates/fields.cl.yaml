# The shared field table. Exercises every declaration key in the chapter below.
# doc: 10-field-declarations.md#declaration-keys

# Every rendered body leads with the item's own name — the Story Card title is invisible
# to the AI storyteller. `cardName.partial` (`{$aid.title} - {tagline}`) carries it, and
# `youLine.partial` (`You: {tagline}`) carries the player block. `Tagline` is consumed by
# those partials rather than declared as its own stanza; field operations act on the raw
# body value, which needs no declaration.

fields:
  vibe:        { label: Vibe, join: "; ", wrap: "[]" }
  appearance:  { label: Appearance,
                 from: [Physical Traits.gender, Physical Traits.age,
                        Physical Traits.hair, Physical Traits.other],
                 join: "; ",
                 labelWhen: { originalAppearance: Current Appearance } }
  originalAppearance: { label: Original Appearance, join: "; " }
  personality: { label: Personality, from: Personality.keywords, join: ", " }
  personalityExpanded: { from: Personality.expanded }
  Magic:       { label: Magic, from: [Magic.affinity, Magic.effect], join: "; " }
  pantheon:    { label: Pantheon, render: keys, block: true }
  # NOTE: the declaration key must match the body key's case. The renderer matches body
  # fields case-insensitively, but CL0426's audit does not — declaring `background` against
  # a `Background:` body key renders correctly and still warns.
  Background:  { label: Background, render: list }
  relationships: { label: Relationships, render: list }
  secret:      { label: Hidden Info, wrap: "[]", wrapLabel: true }
  landmarks:   { render: list }                 # bare — no label
  purpose:     { label: Purpose }
  structure:   { label: Structure, render: list }
  methods:     { label: Methods, render: list }
  overview:    { render: prose }
  status:      { label: Status, always: true }

groups:
  core: [vibe, appearance, originalAppearance, personality, personalityExpanded]

templates:
  Character: [{ include: cardName }, core, Magic, Background, relationships, secret]

  # An inline override: `vibe` renders under a different label and without the join.
  Location: [{ include: cardName }, { field: vibe, label: Culture Vibe, render: bare }, landmarks, pantheon]

  Faction: [{ include: cardName }, overview, purpose, structure, methods, status]

  # A brief list for the Plot Essentials cast slot — still name-led.
  CharacterBrief: [{ include: cardName }, appearance, personality]

  # The Plot Essentials You block — the player, addressed as "You".
  Player: [{ include: youLine }, appearance, personality, personalityExpanded]
