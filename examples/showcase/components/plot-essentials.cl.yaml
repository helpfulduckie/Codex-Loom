# The sectioned grammar. A section carries `text:` or is marked `slot: true`. A slot owns
# the wrapping of everything placed in it.
# doc: 09-components.md#sections-and-slots

sections:
  genre:
    text: |
      Genre: Dark Fantasy | Political Intrigue
      Setting: Feudal empire; {%setting}, %house% wing
    render: {position: 1, wrapper: square}

  you:
    slot: true
    render: {position: 5, wrapper: curly}

  cast:
    slot: true
    render: {position: 6, wrapper: curly}          # wrap: each — one block per character

  hints:
    slot: true
    render: {position: 7, wrapper: curly}
    branches:
      lowContext: ~            # gate the whole slot off the tier
