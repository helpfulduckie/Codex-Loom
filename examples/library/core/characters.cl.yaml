# The core set's cast. Library items carry no `branches:` — a library does not know what
# branches a project has. Dispatch is written on the project's `import:` def instead.
# doc: 04-imports-and-includes.md

# The two `magical` / `mundane` variants on each character are the tone layer a project
# selects with `importVariants:`. They are deltas on the same item rather than separate
# items, which is what lets a setting variant and a tone variant compose on one field.
# doc: 06-field-operations.md

- id: Aness
  name: {display: Aness, full: Aness Kolar}
  pronouns: female
  aid:
    title: Aness Kolar
    type: character
    triggers: [Aness, Kolar]
  render:
    template: Character
  body:
    Tagline: Fixer; knows who owes whom
    vibe: [dry, unhurried, well-connected]
    Physical Traits:
      gender: female
      age: mid 30s
      hair: black hair, cropped short
    Personality:
      keywords: [dry, patient, transactional]
      expanded: '{$Aness} keep[s] a ledger {$Aness.she} never show[s] anyone.'
    relationships:
      - Has done work for every faction and joined none.
    secret: The ledger is not about money.
  variants:
    magical:
      body:
        Tagline: +{; hedge-trained}
        Magic:
          affinity: warding
          effect: doors that will not open for the wrong hand
    mundane:
      body:
        Tagline: +{; strictly unmagical}

- id: Zephon
  name: {display: Zephon, full: Zephon Adrel}
  pronouns: they
  aid:
    title: Zephon Adrel
    type: character
    triggers: [Zephon, Adrel]
  render:
    template: Character
  body:
    Tagline: Archivist turned courier
    vibe: [precise, restless, evasive]
    Physical Traits:
      gender: nonbinary
      age: late 20s
      hair: long brown hair, tied back
    Personality:
      keywords: [precise, restless]
      # Bracket-verb agreement follows the item's `pronouns:`, not the word in front of it.
      # Zephon is `they`, so `{$Zephon} answer[s]` renders "Zephon answer" — the plural
      # rule fires on the name as readily as on the pronoun. Lead with the pronoun where
      # the verb has to agree, and this reads correctly for every pronoun set.
      expanded: '{$Zephon.They} answer[s] the question {$Zephon.they} wish[es] had been asked.'
    Background:
      - Left the archive without giving a reason anyone believed.
    secret: Zephon still has a key to the closed stacks.
  variants:
    magical:
      body:
        Magic:
          affinity: memory
          effect: reading what a page held before it was scraped
    mundane:
      body:
        Tagline: /{Archivist turned courier}/{Courier; former archivist}

- id: Kaiden
  name: {display: Kaiden, full: Kaiden Ross}
  pronouns: male
  aid:
    title: Kaiden Ross
    type: character
    triggers: [Kaiden, Ross]
  render:
    template: Character
  body:
    Tagline: Outrider without a house
    vibe: [wry, watchful, steady]
    Physical Traits:
      gender: male
      age: early 30s
      hair: dark, close-cropped
    Personality:
      keywords: [wry, watchful]
    relationships:
      - Rides the long circuit alone when the roads are bad.
  variants:
    magical:
      body:
        Magic:
          affinity: weather
          effect: an hour's warning before a storm
    mundane: {}

# A character defined by placeholders rather than by the library.
#
# **A project importing this must declare `heroName` and `heroTrait`.** An undeclared
# placeholder is not substituted and not reported — the token survives into the compiled
# card as literal text — so the requirement lives here in the library's README and in this
# comment, which is the only place it can live.
- id: Wayfarer
  name: {display: '%heroName%'}
  pronouns: they
  aid:
    title: '%heroName%'
    type: character
    triggers: ['%heroName%']
  notes: The player character, named at adventure start.
  render:
    template: Character
    storyCard: false
    plotEssential: {slot: you, order: 1}
  body:
    Tagline: '%heroName%, %heroTrait%'
    Physical Traits:
      other: as the player describes
    Personality:
      keywords: ['%heroTrait%']
  variants:
    magical:
      body:
        Magic:
          affinity: undeclared
          effect: whatever the player claims it is
    mundane: {}
