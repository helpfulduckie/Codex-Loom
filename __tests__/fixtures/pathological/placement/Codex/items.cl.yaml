# ── §13: a malformed render-function call in a .template file, latent until Phase 9 ──
# `templates/Broken.template` is `{join($body.Tagline)}` — no quoted separator, which
# fails evaluateJoin's own syntax check. The v3 engine caught this with a bare
# `console.warn` and no code, file, or line; Phase 9 Step 0 turns it into CL0413 naming
# the template file. No render target beyond the story card itself.
- id: BrokenTemplate
  name: BrokenTemplate
  aid:
    type: Character
    triggers: [BrokenTemplate]
  render:
    template: Broken
  body:
    Tagline: Exists only to render a malformed template.

# ── §13: an unclosed {if} block — CL0415, and CL0433 fires on the same output ────
# `templates/Unclosed.template` opens `{if $body.Tagline}` and never closes it, so it
# renders as literal text (the same fallback the v3 regex engine used for a tag it
# couldn't match) — which is why the output sweep's CL0433 LEAKED_TEMPLATE_TAG check
# also fires on the leaked `{if ...}` tag. Per the Phase 9 Session A handoff's Unknowns,
# both reports are kept: one names the template to edit, the other names the output
# that is wrong, and this item is what proves it in the real pipeline rather than only
# in a unit test.
- id: UnclosedBlock
  name: UnclosedBlock
  aid:
    type: Character
    triggers: [UnclosedBlock]
  render:
    template: Unclosed
  body:
    Tagline: Exists only to render an unclosed conditional block.

# ── §9.3: the four role ERRORs, latent until Phase 8 ─────────────────────────
# `roles:` in ../compile.cl.yaml declares a small table so these tokens have a scope to
# fail in. No render target, like Bloated/Ledger/Verbose/Chatty above — this item exists
# only to give the role checks something to fire on, not to test §7.4 placement.
#   {$Anchor}     — the role name collides with the real item id "Anchor": CL0541.
#   {$Missing}    — bound to an id that resolves nowhere: CL0542.
#   {$Loop}       — bound to another role rather than an item id: CL0543.
#   {$Undeclared} — matches no declared role and no item id at all: CL0540.
- id: RoleTester
  name: RoleTester
  aid:
    type: Character
    triggers: [RoleTester]
  body:
    Tagline: "{$Anchor} meets {$Missing}, bound through {$Loop}, beside {$Undeclared}."

