# The placement fixture's items. One correct item, then one item per deliberate mistake.
#
# `Anchor` is correct and exists so the components have an occupant and render — without
# it every component would fail the §7.4 "renders to nothing" ERROR and bury the errors
# this fixture is actually about.

# ── Correct. The control case. ───────────────────────────────────────────────
- id: Anchor
  name: Anchor
  aid:
    type: Character
    triggers: [Anchor]
  body:
    Tagline: The one item here that is written correctly.
  render:
    plotEssential:
      slot: cast
      order: 1

# ── §3.3: a null wildcard in a branch spec — CL0327 ─────────────────────────
# `'*': ~` reads as "exclude from every branch", which nobody means, so the walker skips
# it and the item stays included everywhere. Before CL0327 that skip was silent; now it
# is one WARN per spec object, however many leaves resolve against it — so this fires
# once, not once per branch. `_: ~` is the form the author wanted.
- id: NullWildcard
  name: NullWildcard
  aid:
    type: Character
    triggers: [NullWildcard]
  body:
    Tagline: Its spec says drop it everywhere; the walker keeps it everywhere instead.
  branches:
    '*': ~
  render:
    plotEssential:
      slot: cast
      order: 6

# ── §3.2: a field op whose target substring is absent — CL0328 ──────────────
# The `worn` variant removes "in a controlled bun" from a Tagline that never held the
# phrase. `-{}` is `split().join()`, which hands back the original on a miss, so the op
# silently does nothing. A standalone `-{}` that matches nothing is always a mistake —
# usually the text it was written against has drifted. Only `open` dispatches `worn`, so
# this fires once, on that branch.
- id: DriftedOp
  name: DriftedOp
  aid:
    type: Character
    triggers: [DriftedOp]
  body:
    Tagline: A tagline that never mentioned how the hair was tied.
  branches:
    open: worn
  variants:
    worn:
      Tagline: "-{in a controlled bun}"
  render:
    plotEssential:
      slot: cast
      order: 7

# ── §12.3 check 1: an undeclared placeholder, latent until Phase 4 ───────────
# `%heroName%` is declared in ../compile.cl.yaml; `%ghostName%` is not. Today both survive
# into compiled output as literal text and nothing reports the second.
- id: Greeter
  name: Greeter
  aid:
    type: Character
    triggers: [Greeter]
  body:
    Tagline: '%heroName% is greeted by a stranger who will not give %ghostName% a name.'
  render:
    plotEssential:
      slot: cast
      order: 2

# ── §7.4: an item that vanishes on one branch ────────────────────────────────
# No story card, and its only component target is the `cast` slot — which excludes itself
# on `gated`. Fine on `open`, CL0610 on `gated`.
- id: Ghost
  name: Ghost
  body:
    Tagline: Present on the open path, gone entirely on the gated one.
  render:
    storyCard: false
    plotEssential:
      slot: cast
      order: 3
      template: Character

# ── §7.4: an item with no output anywhere ────────────────────────────────────
# No story card and no component target at all. CL0610 on every branch.
- id: Silent
  name: Silent
  render:
    storyCard: false

# ── §7.4: a target naming a slot no component declares ───────────────────────
# The typo class. `casst` for `cast` — CL0611.
- id: Typo
  name: Typo
  aid:
    type: Character
    triggers: [Typo]
  body:
    Tagline: Targets a slot that does not exist.
  render:
    plotEssential:
      slot: casst

# ── §7.4: a target naming a section that exists but is not a slot ────────────
# `genre` is a text section. CL0612 — a different mistake from the typo above.
- id: NotASlot
  name: NotASlot
  aid:
    type: Character
    triggers: [NotASlot]
  body:
    Tagline: Targets a text section as though it were a slot.
  render:
    plotEssential:
      slot: genre

# ── §7.3: a target naming a slot inside a passthrough component ──────────────
# `ai-instructions.md` is prose and declares no slots at all. CL0611, with a reason that
# says so rather than reading as a typo.
- id: IntoPassthrough
  name: IntoPassthrough
  aid:
    type: Character
    triggers: [IntoPassthrough]
  body:
    Tagline: Targets a slot inside a component that has none.
  render:
    aiInstructions:
      slot: rules

# ── §12.3 check 3: a placeholder in a card's type ─────────────────────────
# `type` is a category in AID and a folder name in the compiled tree, not a text field
# AID fills. The key is declared, so what fires is the destination rule alone.
- id: MistypedType
  name: MistypedType
  aid:
    type: 'Character-%heroName%'
    triggers: [MistypedType]
  body:
    Tagline: Its type carries a placeholder, which is not a thing AID fills.

# ── §17.4: a bare `import:` def, carrying no `id:` of its own ────────────────
# `buildRegistry` skips a bare import by design — it *is* the item it names, so it claims
# no id of its own — while `resolveBranchItems` resolves it like any other def. Together
# that means this def emits a second `Anchor`, under `Anchor`'s id, with no diagnostic
# anywhere: the registry's duplicate-id check never sees it, because neither def is in
# the registry twice.
#
# Two items sharing an id is a mistake in every case the spec describes, so this reports
# CL0325 from `resolveBranchItems` — the only stage that sees both resolved items at once.
# One row per branch on which both defs survive dispatch, because dispatching one of a
# colliding pair away is the documented way to write mutually exclusive versions.
- import: Anchor
  body:
    Tagline: A second Anchor, arriving with no id and no complaint.

# ── §7.6.2a: the arity-N selectors, on the one directive that already has them ──
#
# `include:` stamps its `importVariants:` and its `branches:` onto every item in the file
# it names, which puts both in the arity-N cell of §7.6.2a's table: a name aimed at every
# item in a lore file will miss most of them by construction, because naming it on each
# item is the repetition the include exists to remove. Both should therefore be **silent**
# where an item does not define the name.
#
# Each list carries one real name and one misspelling of it. The real name matches one
# item of three, which is the normal case and is owed nothing. The misspelling matches
# zero, which is the typo — and is the one thing arity-N silence would otherwise hide,
# because a name that applies to nothing changes no output and, without a check, says
# nothing either. That is CL0326.
- include: '{%here}/canon/lore.cl.yaml'
  importVariants: [warm, wrm]

- include: '{%here}/canon/rumors.cl.yaml'
  branches:
    gated: [hushed, hshed]

