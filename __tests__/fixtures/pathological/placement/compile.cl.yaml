# The pathological fixture, placement layer — a project that is wrong on purpose.
#
# Authored from the spec (§7.4's invariant table, §12.3's four checks) *before* Phase 4's
# code exists, so it states what should happen rather than snapshotting what does. See
# ../README.md for why the fixture is split by diagnostic layer.
#
# Every mistake here is deliberate. Nothing in this project should be copied as an example.

version: 4
title: Pathological — Placement

variables:
  here: .

structure:
  input:
    items:
      - '{%here}/Codex'
    templates:
      - '{%here}/templates'
  output: './out'

# ── §12.3 checks 2 and 4, latent until Phase 4 ───────────────────────────────
# Today `placeholders:` draws a NOT_YET_IMPLEMENTED WARN and is ignored, so none of these
# produce a placeholder diagnostic yet. That is the point of authoring them now: the rows
# appear in the snapshot as each check lands, and the diff is the review artifact.
#
#   heroName / altName — check 4: two keys, one question string. AID collapses identical
#                        questions, so the player is prompted once and both keys receive
#                        that answer.
#   neverUsed          — check 2: declared at root, referenced by no body on any branch.
#   longPrompt         — §8.5: a question long enough that its expansion moves a file
#                        across a cap. `%longPrompt%` is 12 characters; the substituted
#                        `${...}` is 79. Nothing else in either corpus exercises that
#                        arithmetic — no golden project declares a placeholder at all.
placeholders:
  heroName: What is your name?
  altName: What is your name?
  neverUsed: Which house raised you?
  longPrompt: What name did the house that raised you give to the child it did not want?

# ── §9.3's four role ERRORs plus §6.4's unused WARN, latent until Phase 8 ────
# Declared at root, so every branch's merged roles table carries all four — RoleTester's
# tokens below therefore fire once per leaf, the same tripling cost the README already
# names for root-unrestricted content.
#   LI      — bound to `Anchor`, a real item. Never referenced by any token: CL0545.
#   Anchor  — a role name equal to the real item id `Anchor`: CL0541 the moment it's used.
#   Missing — bound to `NoSuchItem`, which resolves nowhere: CL0542.
#   Loop    — bound to `LI`, itself a role rather than an item id: CL0543.
roles:
  LI: Anchor
  Anchor: Ghost
  Missing: NoSuchItem
  Loop: LI

components:
  plotEssential: '{%here}/components/plot-essentials.cl.yaml'
  # §12.3 check 3: the Description is one of two destinations where a placeholder does
  # not function at all. Declared or not makes no difference — it is shown before any
  # adventure exists to answer it.
  description: '{%here}/components/description.md'
  # A `.md` passthrough (§7.3): no sections, therefore no slots. An item targeting a slot
  # inside it must get CL0611 naming the reason, not silence.
  aiInstructions: '{%here}/components/ai-instructions.md'

branches:
  open:
    title: The Open Path
    # §8.5, the WARN band. Compiled length is under 3,600 and upload length is not, so a
    # check written against `text.length` reports nothing at all here. CL0711.
    components:
      opening: '{%here}/components/opening-open.md'

  gated:
    # A branch title half-works: the prompt fills and the player sees the answer while
    # choosing, then the saved adventure keeps the raw text. WARN, not ERROR — a
    # deliberate use is possible. The key is declared, so this is the context check
    # firing on its own rather than riding on an undeclared one.
    title: The %heroName% Path
    # §8.5, the cap. Same shape as `open`, eight references instead of five, and the
    # upload length lands past 4,000. CL0710.
    components:
      opening: '{%here}/components/opening-gated.md'
    # The `cast` slot excludes itself on this branch, in the component file. Gating a slot
    # off is legitimate (§7.4) — until it makes an item with no other target vanish
    # entirely, which is what `Ghost` does below.

  # §7.7's one ERROR. This leaf carries an adventure description and declares no opening,
  # and Velvet Lattice reads a node's prompt as `components["Opening"] or node.description`
  # — so the adventure would open on the blurb rather than on a scene. The sibling branches
  # above declare openings and inherit nothing here, which is what makes CL0616 a report
  # about this leaf rather than about the project. Note the description is declared *on the
  # branch*: `adventureDescription:` inherits like any other component, so declaring it at
  # the root would have put a Description.md on all three leaves and told us nothing about
  # whether the guard discriminates.
  silent:
    title: The Silent Path
    components:
      adventureDescription: '{%here}/components/adventure-description.cl.yaml'
