# The kitchen-sink config: every key the v4 surface declares, exercised once.
#
# This is not a scenario. It is a shape fixture — `__tests__/unit/kitchen-sink.test.js`
# walks CONFIG_SCHEMA and fails if any declared key is missing from this file, so adding a
# schema key in a later phase forces an edit here rather than passing unnoticed.
#
# The gap it closes: the three golden fixture projects pin compiled output well, but they
# only use the keys those projects happen to need. None of them declares roles:,
# placeholders:, lint:, structure.input.snapshot, components.summary, a `~` unbind, or the
# mapping form of scripts: — and none puts a {%token} in output: or reports:, which is
# exactly where the Phase 1 audit found a bug that every test missed.
#
# Rules for editing:
#   - Every path-bearing string carries a token, deliberately. The ones the loader expands
#     (structure.*) are asserted to come back absolute and token-free; the rest resolve
#     later against branch-merged variables (§5.1) and are asserted to pass through as
#     written.
#   - Every path the loader checks for existence must exist beside this file, because the
#     test asserts the ONLY diagnostics are the not-yet-implemented WARNs.

version: 4
title: The Kitchen Sink

variables:
  here:         .
  setting:      The Royal Academy
  # A variable referencing a variable (§6.2) — order-independent, so this sits above the
  # name it depends on.
  house:        '{%setting} - Northern Wing'
  canonRoot:    '{%here}/canon'
  codex:        '{%here}/Codex'
  tpl:          '{%here}/templates'
  out:          out
  vaultDir:     '{%here}/vault'
  componentDir: '{%here}/components'
  # §7.6.2's own spelling for the directory a shared component is imported from. A real
  # project points this at a library entry, which §6.1 exposes as a variable of the same
  # shape; the fixture keeps it local so the corpus stays self-contained.
  components:   '{%here}/components/shared'
  scriptDir:    '{%here}/scripts'

structure:
  input:
    items:
      - '{%codex}'
    templates:
      - '{%tpl}'
    library:
      main:    '{%canonRoot}/main'
      general: '{%canonRoot}/general'
    snapshot: '{%vaultDir}'
  output: './{%out}'
  # Reached through a library name rather than a declared variable: library auto-exposes as a
  # variable (§6.1), which is what replaced {@}. Resolves to ./Review.
  reports: '{%main}/../../Review'

# Phase 8. `protagonist` is the built-in role (§9.2) — an ordinary entry here, not its
# own key.
roles:
  protagonist: Aness
  LI:          Kaiden
  rival:       Voss

# Phase 4.
placeholders:
  heroName: What should we call you?
  house:    'Which wing of {%setting} claims you?'

# Phase 5. The mapping form at root; a branch below writes the empty-collection form.
lint:
  level: warn
  packs:
    discovery-markers: {}
    stat-tracker:
      source: '{%here}/lint/stat-tracker.cl.yaml'
      level: error

# The mapping form at root, so all four hook keys are covered here; a branch below writes
# the directory form, so both arms of the union are exercised (§6.3).
scripts:
  input:   '{%scriptDir}/input.js'
  output:  '{%scriptDir}/output.js'
  context: '{%scriptDir}/context.js'
  library: '{%scriptDir}/library.js'

components:
  aiInstructions: '{%componentDir}/ai-instructions.cl.yaml'
  authorsNote:    '{%componentDir}/authors-note.cl.yaml'
  # Two description keys, and the split is §7.7's: `description:` is the scenario blurb
  # AID shows in listings, declared once at the root and never inherited, while
  # `adventureDescription:` is an ordinary inherited component that lands at each leaf and
  # becomes the description of the adventure started there.
  description:    '{%componentDir}/description.cl.yaml'
  adventureDescription: '{%componentDir}/adventure-description.cl.yaml'
  plotEssential:  '{%componentDir}/plot-essentials.cl.yaml'
  summary:        '{%componentDir}/summary.cl.yaml'
  opening:        '{%componentDir}/openings/root.md'
  # A literal rather than a path — the one component spec that is normally prose.
  branchFraming: Which path did they set you on?

# The project rung of the notes ladder (§4.5). Names a template, not a value.
render:
  notesTemplate: ProjectNotes

# Phase 12 (§13.4). A template-selection file per rendering role, branch-addressable.
# `base` names one file; `notes` the list form (several files merge left to right). The
# paths resolve against the templates search path at compile time, like component specs —
# config loading only schema-checks them, so no file needs to exist beside this fixture.
templateFor:
  base:          templates.cl.yaml
  notes:         [notes.cl.yaml, '{%tpl}/mod-notes.cl.yaml']
  plotEssential: pe.cl.yaml

branches:
  subject:
    title: The Subject's Path
    variables:
      role: research subject
    roles:
      protagonist: Veryn
      LI: Felicia
      # `~` unbinds an inherited binding (§6.4). Distinct from the empty collections
      # below, which mean "I have no new things for you".
      rival: ~
    placeholders:
      homeland: Which county raised you?
    # Every component respecified at branch level. Depth matters to the coverage check:
    # a key written only on a grandchild covers `branches.*.branches.*.components.…`, not
    # `branches.*.components.…`, so the full set has to appear on a first-level branch.
    components:
      branchFraming:  Which year did they take you?
      summary:        '{%componentDir}/subject.summary.cl.yaml'
      aiInstructions: '{%componentDir}/subject.ai-instructions.cl.yaml'
      authorsNote:    '{%componentDir}/subject.authors-note.cl.yaml'
      description:    '{%componentDir}/subject.description.cl.yaml'
      adventureDescription: '{%componentDir}/subject.adventure-description.cl.yaml'
      plotEssential:  '{%componentDir}/subject.plot-essentials.cl.yaml'
      opening:        '{%componentDir}/openings/subject.md'
    # `~` unbinds the project's notes template for this branch, leaving §4.5's default
    # rendering. The branch rung exists for the mod case: a branch that does not load the
    # mod a marker belongs to points at a blank template instead, which emits no line.
    render:
      notesTemplate: ~
    # One role reslotted for this branch; `base` and `plotEssential` inherit the root's
    # files (§13.4's key-wise merge). Depth matters to the coverage check — the key has to
    # appear on a first-level branch to cover `branches.*.templateFor`.
    templateFor:
      base: '{%tpl}/terse.cl.yaml'
    scripts:
      input:   '{%scriptDir}/input.js'
      output:  '{%scriptDir}/output.js'
      context: '{%scriptDir}/context.js'
      # The bundle case: one hook swapped, the other three inherited (§6.3).
      library: '{%scriptDir}/bundles/modA.js'
    lint:
      level: error
      packs:
        stat-tracker: ~
    branches:
      year-one:
        title: First Year
        # An empty mapping: present, inherited, unmodified (§3.3).
        variables: {}
        # The realistic leaf override: one component, the rest inherited.
        components:
          opening: '{%componentDir}/openings/subject-y1.md'
        branches:
          # A whole branch node written as an empty sequence — The Institute does this at
          # every leaf, and it must normalize to a mapping without complaint.
          honors: []
      year-three:
        title: Third Year
        # The directory arm of the scripts: union.
        scripts: '{%scriptDir}/bundles/modB'
        lint:
          # The empty-sequence spelling of an empty collection, at a slot declared as a
          # mapping. Two spellings of nothing (§3.3), not two shapes of content.
          packs: []

  researcher: []
